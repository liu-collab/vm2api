name: refprobe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ref creation with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          same=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          echo "--- probe A: tag at default-branch HEAD (workflow files identical) ---"
          gh api --method POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/zzprobe-same" -f sha="$same" \
            && echo "PROBE_A=OK" || echo "PROBE_A=DENIED"

          diff=$(gh api repos/dofastted/vm2api/commits/v1.3.29 --jq .sha)
          echo "--- probe B: tag at upstream v1.3.29 commit (workflow files differ) ---"
          gh api --method POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/zzprobe-diff" -f sha="$diff" \
            && echo "PROBE_B=OK" || echo "PROBE_B=DENIED"

          echo "--- cleanup ---"
          gh api --method DELETE repos/${{ github.repository }}/git/refs/tags/zzprobe-same && echo "DEL_A=OK" || echo "DEL_A=FAILED"
          gh api --method DELETE repos/${{ github.repository }}/git/refs/tags/zzprobe-diff && echo "DEL_B=OK" || echo "DEL_B=FAILED"