name: apitest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Try creating a tag ref via REST API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          sha=$(gh api repos/dofastted/vm2api/git/ref/tags/v1.3.29 --jq .object.sha)
          type=$(gh api repos/dofastted/vm2api/git/ref/tags/v1.3.29 --jq .object.type)
          echo "upstream v1.3.29 -> $sha ($type)"
          gh api --method POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/v1.3.29" -f sha="$sha" && echo "CREATE_OK" || echo "CREATE_FAILED"